[build-system]
requires = ["setuptools>=68", "setuptools_scm>=7"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
fallback_version = "999"

[project]
name = "cchdo.auth"
authors = [{name = "cchdo", email = "cchdo@ucsd.edu"}]
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.13"
dynamic = ["version"]
license = {text = "BSD 3-clause"}
dependencies = [
  "requests>=2.23.0",
  "click>=7.0.0",
  "appdirs>=1.4.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://cchdo.ucsd.edu/"
Documentation = "https://cchdo.github.io/auth"
Repository = "https://github.com/cchdo/auth.git"

[project.optional-dependencies]
selftest = [
    "pytest",
    "pyfakefs",
]
docs = [
    "Sphinx",
    "furo",
]
complete = [
    "cchdo.auth[selftest,docs]"
]

[dependency-groups]
dev = [
    "cchdo.auth[selftest,docs]",
    "coverage",
    "pytest-cov",
    "pre-commit",
    "requests-mock",
    "ipython>=9.18.1",
    "ty>=0.0.105",
    "ruff>=0.17.5",
]

[tool.mypy]
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "pytest.*",
    "appdirs",
    "google.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# E402: module level import not at top of file
# E501: line too long - let black worry about that
# E731: do not assign a lambda expression, use a def
ignore = [
    "E402",
    "E501",
    "E731",
]
select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E",
    "W",
    # isort
    "I",
    # Pyupgrade
    "UP",
    # Tidy imports
    "TID",
]

[tool.ruff.lint.isort]
known-first-party = ["cchdo"]
